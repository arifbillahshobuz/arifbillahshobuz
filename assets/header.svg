<svg width="1200" height="250" viewBox="0 0 1200 250"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="45%" stop-color="#0B1F33"/>
      <stop offset="75%" stop-color="#162A46"/>
      <stop offset="100%" stop-color="#271A45"/>
    </linearGradient>

    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- Background -->

  <rect width="1200" height="250" fill="url(#bg)"/>

  <!-- Animated stars -->

  <g fill="#67E8F9">

    <circle cx="100" cy="55" r="2">
      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="280" cy="90" r="2">
      <animate attributeName="opacity"
               values="1;0.2;1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="500" cy="40" r="2">
      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="760" cy="75" r="2">
      <animate attributeName="opacity"
               values="1;0.2;1"
               dur="2.2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="50" r="2">
      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Floating particles -->

  <g fill="#8B5CF6">

    <circle cx="180" cy="150" r="3">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;20 -15;0 0"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="930" cy="130" r="3">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;-20 15;0 0"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Main animated wave -->

  <path
    d="M0 175
       C150 125 250 225 400 175
       S650 125 800 175
       S1050 225 1200 160
       L1200 250
       L0 250 Z"
    fill="url(#wave)"
    opacity="0.18">

    <animate
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
      M0 175 C150 125 250 225 400 175 S650 125 800 175 S1050 225 1200 160 L1200 250 L0 250 Z;

      M0 160 C150 210 250 110 400 165 S650 215 800 155 S1050 105 1200 175 L1200 250 L0 250 Z;

      M0 175 C150 125 250 225 400 175 S650 125 800 175 S1050 225 1200 160 L1200 250 L0 250 Z
      "/>

  </path>

  <!-- Glowing wave line -->

  <path
    d="M0 175
       C150 125 250 225 400 175
       S650 125 800 175
       S1050 225 1200 160"
    fill="none"
    stroke="url(#wave)"
    stroke-width="3"
    filter="url(#glow)">

    <animate
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      values="
      M0 175 C150 125 250 225 400 175 S650 125 800 175 S1050 225 1200 160;

      M0 160 C150 210 250 110 400 165 S650 215 800 155 S1050 105 1200 175;

      M0 175 C150 125 250 225 400 175 S650 125 800 175 S1050 225 1200 160
      "/>

  </path>

  <!-- Name -->

  <text
    x="600"
    y="95"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="38"
    font-weight="700"
    fill="#FFFFFF">

    MD. ARIF BILLAH SHOBUZ

  </text>

  <!-- Role -->

  <text
    x="600"
    y="125"
    text-anchor="middle"
    font-family="monospace"
    font-size="17"
    fill="#9BE9FF">

    &lt;/&gt; PHP Laravel Developer | Backend Engineer

  </text>

</svg>
